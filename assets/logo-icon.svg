<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="ECS Drive logo">
  <circle cx="60" cy="60" r="54" fill="#00a884"/>
  <!-- Cloud (white), built from overlapping solid shapes for predictable
       results without a live renderer to check against. -->
  <circle cx="42" cy="56" r="14" fill="#ffffff"/>
  <circle cx="60" cy="48" r="17" fill="#ffffff"/>
  <circle cx="78" cy="56" r="14" fill="#ffffff"/>
  <rect x="32" y="58" width="56" height="26" rx="13" fill="#ffffff"/>
  <!-- Document card (green, cut into the white cloud) with a folded
       corner and two text-line marks, cut back to white. -->
  <rect x="46" y="54" width="28" height="30" rx="3" fill="#00a884"/>
  <polygon points="74,54 74,64 64,54" fill="#ffffff"/>
  <rect x="52" y="68" width="16" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="52" y="76" width="16" height="3" rx="1.5" fill="#ffffff"/>
</svg>
